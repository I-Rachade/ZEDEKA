# Diagnostic temporaire (à supprimer) : migrations en attente et erreurs récentes de l'API en ligne.
name: Diagnostic API en ligne
on:
  push:
    branches: [claude/project-thread-xbfwon]
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo "token: oui" || echo "token: non"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "compte: oui" || echo "compte: non"
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Migrations en attente (lecture seule)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: backend
        run: npx -y wrangler@4 d1 migrations list zedeka-db --remote || true
      - name: Erreurs récentes de zedeka-api
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          NOW=$(date +%s000); FROM=$((NOW - 6*3600*1000))
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' \
            -d "{\"queryId\":\"diag\",\"timeframe\":{\"from\":$FROM,\"to\":$NOW},\"view\":\"events\",\"limit\":50,\"parameters\":{\"filters\":[{\"key\":\"\$metadata.service\",\"operation\":\"eq\",\"type\":\"string\",\"value\":\"zedeka-api\"},{\"key\":\"\$metadata.error\",\"operation\":\"exists\",\"type\":\"string\"}]}}" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps(d,ensure_ascii=False)[:20000])'
