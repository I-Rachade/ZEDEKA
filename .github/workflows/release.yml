# Publie une version figée quand une étiquette « v* » est poussée (ex. v1.0.0) :
# construit les 4 APK (client, livreur, restaurant, admin) depuis l'étiquette et crée la release GitHub
# avec le texte de CHANGELOG.md et les APK en pièces jointes. Ne touche pas au site en ligne.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, livreur, restaurant, admin]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - run: echo "ZEDEKA_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/${{ matrix.app }}/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/${{ matrix.app }}/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "zedeka-${{ matrix.app }}-${{ github.ref_name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: zedeka-${{ matrix.app }}-apk
          path: mobile/${{ matrix.app }}/zedeka-${{ matrix.app }}-${{ github.ref_name }}.apk

  release:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: apk
          merge-multiple: true
      - name: Texte de la release (section de CHANGELOG.md)
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          printf '\n### APK\nAPK de test (non signés pour le Play Store) des 4 applications, construits depuis %s.\n' "$GITHUB_REF_NAME" >> notes.md
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"; title="${v%.0}"
          gh release create "$GITHUB_REF_NAME" apk/*.apk \
            --title "Zedeka ${title}" \
            --notes-file notes.md \
            --verify-tag
