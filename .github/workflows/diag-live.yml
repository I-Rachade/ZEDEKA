# Diagnostic temporaire (à supprimer) : réponses de l'API en ligne pour l'espace restaurant.
name: Diagnostic API en ligne
on:
  push:
    branches: [claude/project-thread-xbfwon]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Requêtes
        run: |
          B=https://zedeka.poinderecharge.com
          for p in /api/health /api/zones /api/restaurant/me /api/restaurants; do
            echo "== GET $p"; curl -s -m 30 -w '\n[%{http_code}]\n' "$B$p" | tail -c 600; done
          for email in chez-tante-ama@demo.zedeka.tg le-maquis-du-port@demo.zedeka.tg; do
            echo "== login $email"
            R=$(curl -s -m 30 "$B/api/restaurant/login" -H 'content-type: application/json' -d "{\"email\":\"$email\",\"password\":\"zedeka-demo\"}")
            T=$(echo "$R" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))' 2>/dev/null)
            echo "$R" | head -c 200 | sed 's/"token":"[^"]*"/"token":"…"/'; echo
            [ -z "$T" ] && continue
            for p in me dashboard "orders?active=1" orders menu; do
              echo "-- $p"; curl -s -m 30 -D - -o body.txt -H "Authorization: Bearer $T" "$B/api/restaurant/$p" | head -1; head -c 500 body.txt; echo
            done
            break
          done
