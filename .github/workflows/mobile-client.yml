# Construit l'application client Android (APK de test, non signé pour le Play Store) à chaque changement de mobile/client.
# L'APK se télécharge dans l'onglet Actions, rubrique « Artifacts » de l'exécution.
name: App client Android

on:
  push:
    paths: ["mobile/client/**", ".github/workflows/mobile-client.yml"]
  pull_request:
    paths: ["mobile/client/**", ".github/workflows/mobile-client.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/client/android
      - uses: actions/upload-artifact@v4
        with:
          name: zedeka-client-debug-apk
          path: mobile/client/android/app/build/outputs/apk/debug/app-debug.apk
