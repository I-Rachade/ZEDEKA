# Construit les applications Android (APK de test, non signés pour le Play Store) à chaque changement de mobile/.
# Les APK se téléchargent dans l'onglet Actions, rubrique « Artifacts » de l'exécution.
name: Apps Android

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-android.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-android.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, livreur, restaurant, admin, marchand]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/${{ matrix.app }}/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/${{ matrix.app }}/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zedeka-${{ matrix.app }}-debug-apk
          path: mobile/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
