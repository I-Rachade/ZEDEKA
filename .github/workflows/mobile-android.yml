# Construit les applications Android (APK de test, non signés pour le Play Store) à chaque changement de mobile/.
# Les APK se téléchargent dans l'onglet Actions, rubrique « Artifacts » de l'exécution.
name: Apps Android

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-android.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-android.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, livreur, restaurant]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/${{ matrix.app }}/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/${{ matrix.app }}/android
      - uses: actions/upload-artifact@v4
        with:
          name: zedeka-${{ matrix.app }}-debug-apk
          path: mobile/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk

  # Temporaire : copie les trois APK sur la branche apk-builds pour les récupérer hors GitHub Actions.
  publish:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
      - run: |
          mkdir out
          for a in client livreur restaurant; do cp apks/zedeka-$a-debug-apk/app-debug.apk out/zedeka-$a.apk; done
          cd out
          git init -q -b apk-builds
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add . && git commit -qm "APK ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-builds
