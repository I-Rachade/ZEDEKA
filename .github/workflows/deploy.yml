# Déploiement sur Cloudflare à chaque fusion dans la branche principale (ou à la main : onglet Actions > Run workflow).
# Secrets du dépôt nécessaires (Settings > Secrets and variables > Actions) : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Déploiement Cloudflare

on:
  push:
    branches: [claude/project-thread-bkj77u]
  workflow_dispatch:

# Un seul déploiement à la fois ; un nouveau attend la fin du précédent.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  api:
    name: API (zedeka-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Migrations D1 (zedeka-db) puis déploiement du Worker.
      - run: npm run deploy

  site:
    name: Site (zedeka-web)
    needs: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run deploy
      - name: Vérification en ligne
        run: |
          curl -fsS https://zedeka.poinderecharge.com/api/health
          curl -fsSI https://zedeka.poinderecharge.com/ | grep -i content-security-policy
