# Fond de carte Zedeka : découpe la carte du Togo dans le dernier export mondial de Protomaps (tiré d'OpenStreetMap)
# et la range dans R2 (zedeka-media/cartes/togo.pmtiles), d'où l'API sert les tuiles (backend/src/mapTiles.ts).
# Chaque mois pour suivre les rues ajoutées à OpenStreetMap, ou à la demande (Actions > « Carte du Togo » > Run workflow).
# Secrets : CLOUDFLARE_API_TOKEN (avec Workers R2 Storage : Edit) et CLOUDFLARE_ACCOUNT_ID, les mêmes que deploy.yml.
name: Carte du Togo

on:
  schedule:
    - cron: "17 3 2 * *"
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/carte.yml"]

concurrency:
  group: carte-togo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  carte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Outil pmtiles
        run: |
          gh release download --repo protomaps/go-pmtiles --pattern '*_Linux_x86_64.tar.gz' --output pmtiles.tar.gz
          tar -xzf pmtiles.tar.gz pmtiles
          ./pmtiles version
      - name: Dernier export mondial
        id: build
        run: |
          for d in $(seq 0 14); do
            name="$(date -u -d "-$d day" +%Y%m%d).pmtiles"
            if curl -sfI "https://build.protomaps.com/$name" > /dev/null; then
              echo "url=https://build.protomaps.com/$name" >> "$GITHUB_OUTPUT"
              echo "Export : $name"
              exit 0
            fi
          done
          echo "::error::Aucun export Protomaps trouvé sur les 15 derniers jours."
          exit 1
      - name: Découpe du Togo
        run: |
          ./pmtiles extract "${{ steps.build.outputs.url }}" togo.pmtiles --bbox=-0.25,5.85,1.95,11.2 --download-threads=4
          ./pmtiles show togo.pmtiles
          ls -lh togo.pmtiles
      - name: Vérifie une tuile de Lomé
        run: |
          ./pmtiles tile togo.pmtiles 15 16495 15824 > lome.mvt
          test -s lome.mvt
          echo "Tuile de Lomé : $(stat -c %s lome.mvt) octets"
      - name: Envoi dans R2
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID absents."
            exit 1
          fi
          npx --yes wrangler@4.154.0 r2 object put zedeka-media/cartes/togo.pmtiles --file togo.pmtiles --content-type application/vnd.pmtiles --remote
